name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black ruff pytest pytest-cov
    
    - name: Run black
      run: black --check src/ scripts/ tests/ demo/
    
    - name: Run ruff
      run: ruff check src/ scripts/ tests/ demo/
    
    - name: Run type checking
      run: |
        pip install mypy
        mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build-and-test:
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run training pipeline
      run: |
        python scripts/train.py \
          --model-type tiny_cnn \
          --epochs 2 \
          --batch-size 32 \
          --compress \
          --export \
          --output-dir test_outputs
    
    - name: Test model export
      run: |
        python -c "
        import sys
        sys.path.append('src')
        from export import ModelExporter
        from models import create_model
        from utils import get_device
        import torch
        
        model = create_model('tiny_cnn', num_classes=3)
        device = get_device()
        exporter = ModelExporter(model, device)
        
        # Test ONNX export
        exporter.export_to_onnx('test_model.onnx')
        print('Model export test passed')
        "
    
    - name: Upload test artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-outputs
        path: test_outputs/

  demo-test:
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test Streamlit demo
      run: |
        python -c "
        import streamlit as st
        import sys
        sys.path.append('src')
        
        # Test demo imports
        from demo.app import *
        print('Demo imports successful')
        "
    
    - name: Test demo functionality
      run: |
        python -c "
        import sys
        sys.path.append('src')
        from models import create_model
        from utils import get_device
        import torch
        import numpy as np
        
        # Test demo components
        model = create_model('tiny_cnn', num_classes=3)
        device = get_device()
        
        # Test inference
        x = torch.randn(1, 3, 32, 32)
        with torch.no_grad():
            output = model(x)
        
        print('Demo functionality test passed')
        "

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit safety
    
    - name: Run bandit security scan
      run: |
        bandit -r src/ scripts/ demo/ -f json -o bandit-report.json || true
    
    - name: Run safety check
      run: |
        safety check --json --output safety-report.json || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  performance-test:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run performance benchmarks
      run: |
        python -c "
        import sys
        sys.path.append('src')
        from models import create_model
        from utils import get_device, PerformanceProfiler
        import torch
        import time
        
        # Test model performance
        model = create_model('tiny_cnn', num_classes=3)
        device = get_device()
        model.to(device)
        model.eval()
        
        profiler = PerformanceProfiler()
        
        # Benchmark inference
        x = torch.randn(1, 3, 32, 32).to(device)
        
        # Warmup
        for _ in range(10):
            with torch.no_grad():
                _ = model(x)
        
        # Benchmark
        profiler.start_timer('inference')
        for _ in range(100):
            with torch.no_grad():
                _ = model(x)
        duration = profiler.end_timer('inference')
        
        avg_time = duration / 100
        fps = 1.0 / avg_time
        
        print(f'Average inference time: {avg_time*1000:.2f}ms')
        print(f'Throughput: {fps:.2f} FPS')
        
        # Performance thresholds
        assert avg_time < 0.1, f'Inference too slow: {avg_time*1000:.2f}ms'
        assert fps > 10, f'Throughput too low: {fps:.2f} FPS'
        
        print('Performance test passed')
        "
